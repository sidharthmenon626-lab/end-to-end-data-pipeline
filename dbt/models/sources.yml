version: 2

sources:
  - name: raw
    database: analytics_dw
    schema: raw
    description: "Landing and raw ingestion schema populated by the Python streaming/CDC pipeline."
    freshness:
      warn_after: {count: 24, period: hour}
      error_after: {count: 72, period: hour}
    loaded_at_field: _ingested_at

    tables:
      - name: raw_customers
        description: "Customer master and profile CDC records tracking account status and plan tiers."
        freshness:
          warn_after: {count: 24, period: hour}
          error_after: {count: 72, period: hour}
        columns:
          - name: customer_id
            description: "Primary natural key for the customer."
            tests:
              - unique
              - not_null
          - name: source_updated_at
            description: "Source mutation timestamp for sequence ordering and CDC."
            tests:
              - not_null
          - name: _source_op
            description: "CDC operation indicator ('I' for Insert, 'U' for Update, 'D' for Delete)."
            tests:
              - not_null
          - name: _is_deleted
            description: "Soft deletion tombstone flag."
            tests:
              - not_null

      - name: raw_orders
        description: "Discrete e-commerce order transactions captured from checkout."
        freshness:
          warn_after: {count: 12, period: hour}
          error_after: {count: 48, period: hour}
        columns:
          - name: order_id
            description: "Unique identifier for each transaction."
            tests:
              - unique
              - not_null
          - name: customer_id
            description: "Foreign key referencing raw_customers."
            tests:
              - not_null
          - name: order_timestamp
            description: "Timestamp when the customer placed the order."
            tests:
              - not_null
          - name: order_amount_usd
            description: "Gross order amount in USD."
            tests:
              - not_null

      - name: raw_subscriptions
        description: "Lifecycle events for SaaS subscription contracts (creation, updates, renewals, cancellations)."
        freshness:
          warn_after: {count: 24, period: hour}
          error_after: {count: 72, period: hour}
        columns:
          - name: subscription_event_id
            description: "Unique identifier for each subscription lifecycle event record."
            tests:
              - unique
              - not_null
          - name: subscription_id
            description: "Natural key identifying the subscription contract across its lifecycle."
            tests:
              - not_null
          - name: customer_id
            description: "Foreign key referencing raw_customers."
            tests:
              - not_null
          - name: event_timestamp
            description: "Timestamp when the subscription event occurred."
            tests:
              - not_null

      - name: raw_events
        description: "High-volume web and mobile application clickstream events."
        freshness:
          warn_after: {count: 12, period: hour}
          error_after: {count: 48, period: hour}
        columns:
          - name: event_id
            description: "Unique event identifier."
            tests:
              - unique
              - not_null
          - name: customer_id
            description: "Identifier of the customer who generated the event."
            tests:
              - not_null
          - name: event_timestamp
            description: "Timestamp when the event was fired."
            tests:
              - not_null
