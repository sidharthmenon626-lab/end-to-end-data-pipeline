name: CI Pipeline

"on":
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Code Hygiene & Style (Ruff)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Ruff
        run: pip install ruff

      - name: Run Ruff Linter
        run: ruff check src/ tests/

      - name: Run Ruff Formatter Check
        run: ruff format --check src/ tests/

  pipeline-test:
    name: Pipeline Validation & Quality Checks
    runs-on: ubuntu-latest
    needs: lint
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_DB: analytics_dw
          POSTGRES_USER: pipeline_user
          POSTGRES_PASSWORD: pipeline_secure_pass
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      POSTGRES_HOST: localhost
      POSTGRES_PORT: 5432
      POSTGRES_DB: analytics_dw
      POSTGRES_USER: pipeline_user
      POSTGRES_PASSWORD: pipeline_secure_pass
      AIRFLOW_HOME: ${{ github.workspace }}/airflow
      PYTHONPATH: ${{ github.workspace }}
      DBT_PROFILES_DIR: ${{ github.workspace }}/dbt

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Initialize Airflow Metadata DB
        run: |
          airflow db migrate || airflow db init

      - name: Initialize Warehouse Schemas and Landing Tables
        run: |
          python -m src.utils.init_warehouse

      - name: Verify Airflow DAG Integrity
        run: |
          airflow dags list-import-errors

      - name: Run Unit & Integration Test Suite
        run: |
          pytest tests/ -v

      - name: Execute End-to-End Ingestion Pipeline
        run: |
          python -m src.ingest.pipeline

      - name: Execute dbt Transform, Marts & Data Contract Tests
        run: |
          cd dbt
          dbt build --profiles-dir .

      - name: Run Warehouse Health & Anomaly Monitoring
        run: |
          python -m src.monitoring

      - name: Upload Monitoring Summary Artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: monitoring-summary
          path: data/monitoring_summary.json
