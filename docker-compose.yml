version: '3.8'

services:
  warehouse:
    image: postgres:16-alpine
    container_name: analytics_warehouse
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${WAREHOUSE_DB:-analytics_dw}
      POSTGRES_USER: ${WAREHOUSE_USER:-pipeline_user}
      POSTGRES_PASSWORD: ${WAREHOUSE_PASSWORD:-pipeline_secure_pass}
    ports:
      - "${WAREHOUSE_PORT:-5432}:5432"
    volumes:
      - warehouse_data:/var/lib/postgresql/data
      - ./warehouse/init.sql:/docker-entrypoint-initdb.d/01_init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${WAREHOUSE_USER:-pipeline_user} -d ${WAREHOUSE_DB:-analytics_dw}"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  warehouse_data:
    driver: local
